version: "3.8"
services:
  backend:
    image: fastapi_backend:latest
    restart: unless-stopped
    # Read secrets from runtime environment (injected by CI / orchestrator)
    environment:
      DB_URL: ${DB_URL}
      SSL_CA_PATH: /etc/ssl/certs/ca-certificate.crt
      DB_ECHO: ${DB_ECHO:-0}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-1}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      ENABLE_MONTHLY_SEED_JOB: ${ENABLE_MONTHLY_SEED_JOB:-true}
      SEED_DATA_DIR: ${SEED_DATA_DIR:-/var/lib/citibike/daily}
    secrets:
      - source: db-ca-cert
        target: /etc/ssl/certs/ca-certificate.crt
    volumes:
      - citibike_daily_data:/var/lib/citibike/daily
    networks:
      - app-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  citibike_daily_data:

secrets:
  db-ca-cert:
    file: ${SSL_CA_SOURCE_FILE}

networks:
  app-network:
    driver: bridge
