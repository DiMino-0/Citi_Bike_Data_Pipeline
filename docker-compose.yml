services:
  # The PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citibike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citibike}
      POSTGRES_DB: ${POSTGRES_DB:-citibike}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-citibike} -d ${POSTGRES_DB:-citibike}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # This persists database data on your local machine
      - postgres_data:/var/lib/postgresql/data
      # This runs our initialization script on the first startup
      - ./server/database/Citi Bike Database.session.sql:/docker-entrypoint-initdb.d/db_setup.sql:ro
    networks:
      - app-network

  # FastAPI Backend Service
  backend:
    build: ./server
    container_name: fastapi_backend
    env_file:
      - ./server/.env
    environment:
      # Uses the local Postgres container by default; set DB_URL from an env-file or shell to use the remote database.
      DB_URL: ${DB_URL:-postgresql+asyncpg://citibike:citibike@db:5432/citibike}
      SEED_DATA_DIR: ${SEED_DATA_DIR:-/app/scratch/data}
      ENABLE_STARTUP_SEED: ${ENABLE_STARTUP_SEED:-true}
      STARTUP_SEED_RANGE: ${STARTUP_SEED_RANGE:-2013..202602}
      STARTUP_SEED_INGEST_IF_MISSING: ${STARTUP_SEED_INGEST_IF_MISSING:-true}
    volumes:
      - type: bind
        source: ${SSL_CA_HOST_PATH:-C:/Users/josep/Documents/ca-certificate.crt}
        target: /etc/ssl/certs/ca-certificate.crt
        read_only: true
      - ./server/scratch/data:/app/scratch/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # The React Frontend & NGINX Reverse Proxy Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: react_frontend
    ports:
      # Map port 3000 on host machine to port 80 inside the container (where Nginx is listening)
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

# Define the network
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
