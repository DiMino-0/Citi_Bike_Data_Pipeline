services:
  # The PostgreSQL Database Service
  db:
    profiles: ["local-db"]
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citibike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citibike}
      POSTGRES_DB: ${POSTGRES_DB:-citibike}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-citibike} -d ${POSTGRES_DB:-citibike}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # This persists database data on your local machine
      - postgres_data:/var/lib/postgresql/data
      # This runs our initialization script on the first startup
      - ./server/database/Citi Bike Database.session.sql:/docker-entrypoint-initdb.d/db_setup.sql:ro
    networks:
      - app-network

  # FastAPI Backend Service
  backend:
    build: ./server
    container_name: fastapi_backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # DB_URL comes from ./server/.env (remote DB in your current setup).
      SEED_DATA_DIR: ${SEED_DATA_DIR:-/app/scratch/data}
      ENABLE_STARTUP_SEED: ${ENABLE_STARTUP_SEED:-false}
      # STARTUP_SEED_RANGE: ${STARTUP_SEED_RANGE:-2013..202511}
      # STARTUP_SEED_MONTH: ${STARTUP_SEED_MONTH:-202511}
      STARTUP_SEED_INGEST_IF_MISSING: ${STARTUP_SEED_INGEST_IF_MISSING:-true}
      STARTUP_SEED_BACKFILL_MISSING_ROWS: ${STARTUP_SEED_BACKFILL_MISSING_ROWS:-false}
      DAILY_SEED_BACKFILL_MISSING_ROWS: ${DAILY_SEED_BACKFILL_MISSING_ROWS:-false}
    volumes:
      - type: bind
        source: ${SSL_CA_HOST_PATH:-C:/Users/josep/Documents/ca-certificate.crt}
        target: /etc/ssl/certs/ca-certificate.crt
        read_only: true
      # Persist fetched parquet files in the repository scratch/data directory.
      - ./server/scratch/data:/app/scratch/data
    networks:
      - app-network

  # The React Frontend & NGINX Reverse Proxy Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: unless-stopped
    ports:
      # Map port 3000 on host machine to port 80 inside the container (where Nginx is listening)
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

# Define the network
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
