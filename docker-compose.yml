services:
  # The PostgreSQL Database Service
  # db:
  #   image: postgres:15-alpine
  #   container_name: postgres_db
  #   env_file:
  #     - ./server/.env
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-citibike}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citibike}
  #     POSTGRES_DB: ${POSTGRES_DB:-citibike}
  #   volumes:
  #     # This persists database data on your local machine
  #     - postgres_data:/var/lib/postgresql/data
  #     # This runs our initialization script on the first startup
  #     - ./server/database/Citi Bike Database.session.sql:/docker-entrypoint-initdb.d/db_setup.sql
  #   networks:
  #     - app-network

  # FastAPI Backend Service
  backend:
    build: ./server
    container_name: fastapi_backend
    env_file:
      - ./server/.env
    environment:
      SEED_DATA_DIR: ${SEED_DATA_DIR:-/app/scratch/data}
    volumes:
      - C:/Users/josep/Documents/ca-certificate.crt:/etc/ssl/certs/ca-certificate.crt:ro
      - ./server/scratch/data:/app/scratch/data
    # depends_on:
    #   - db
    networks:
      - app-network

  # The React Frontend & NGINX Reverse Proxy Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: react_frontend
    ports:
      # Map port 3000 on host machine to port 80 inside the container (where Nginx is listening)
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

# Define the network
networks:
  app-network:
    driver: bridge

